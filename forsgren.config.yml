# forsgren configuration for this installation: which projects and
# repositories the page measures. Replace the acme example with your own.
#
# forsgren 0.0.2 checks this file before every daily run: a missing or invalid
# file turns the run red with a one-line message. Check it yourself with
#   forsgren check-config --config forsgren.config.yml
# (it does not measure anything yet; that comes in later releases).
#
# deployment, per repository, says what counts as a deployment:
#   (left out)              GitHub Deployments to the environment production
#   environment=<name>      GitHub Deployments to another environment
#   workflow=<file>.yml     a successful run of that workflow on the default branch
#   release                 a published GitHub Release
version: 1
projects:
  - name: Acme Shop
    repositories:
      - name: acme/api
      - name: acme/ios-app
        deployment: workflow=testflight.yml
  - name: Acme Tools
    repositories:
      - name: acme/cli
        deployment: release
